appId: community.blacksky.app
---
- runFlow:
    file: ../../helpers/group-invite-setup.yml
    env:
      SCENARIO: rate-limit
- runFlow:
    file: ../../helpers/group-invite-sign-in-alice.yml
- openLink: 'blacksky://join/${output.groupInviteCode}'
- extendedWaitUntil:
    visible:
      id: groupInviteAcceptButton
    timeout: 30000
- tapOn:
    id: groupInviteAcceptButton
- extendedWaitUntil:
    visible:
      id: groupInviteRetryButton
    timeout: 30000
- assertVisible: 'Too many attempts. Please try again shortly.'
- tapOn:
    id: groupInviteRetryButton
- runScript:
    file: ../../helpers/assert-group-invite-state.js
    env:
      EXPECT_ACCEPT_REQUESTS: '1'
      EXPECT_ACCEPT_WITH_BEARER: '1'
      EXPECT_CLAIM_COUNT: '0'
