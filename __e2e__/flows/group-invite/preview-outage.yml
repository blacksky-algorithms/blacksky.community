appId: community.blacksky.app
---
- runFlow:
    file: ../../helpers/group-invite-setup.yml
    env:
      SCENARIO: preview-outage
- openLink: 'blacksky://join/${output.groupInviteCode}'
- extendedWaitUntil:
    visible:
      id: groupInviteLandingRetry
    timeout: 30000
- assertVisible: 'We could not contact the group service. Please try again.'
- tapOn:
    id: groupInviteLandingRetry
