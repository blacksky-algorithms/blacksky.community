appId: community.blacksky.app
---
- runFlow:
    file: ../../helpers/group-invite-setup.yml
    env:
      SCENARIO: pin-update
- runFlow:
    file: ../../helpers/group-invite-sign-in-alice.yml
- tapOn:
    id: e2eGroupInviteFailUpdate
- openLink: 'blacksky://join/${output.groupInviteCode}'
- extendedWaitUntil:
    visible:
      id: groupInviteAcceptButton
    timeout: 30000
- tapOn:
    id: groupInviteAcceptButton
- extendedWaitUntil:
    visible:
      id: groupInvitePinOpenButton
    timeout: 30000
- tapOn:
    id: groupInvitePinOpenButton
- extendedWaitUntil:
    visible:
      id: groupInvitePinError
    timeout: 30000
- assertVisible: 'We could not save your feeds. Please try again.'
- tapOn:
    id: groupInvitePinRetryButton
- extendedWaitUntil:
    visible:
      id: homeScreen
    timeout: 30000
- runScript:
    file: ../../helpers/assert-group-invite-state.js
    env:
      EXPECT_ACCEPT_REQUESTS: '1'
      EXPECT_CLAIM_COUNT: '1'
      EXPECT_SAVED_TOTAL: '2'
      EXPECT_SAVED_PINNED: '2'
      EXPECT_SAVED_VISIBLE: '2'
      EXPECT_VISIBLE_PINNED: '2'
