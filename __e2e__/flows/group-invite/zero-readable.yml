appId: community.blacksky.app
---
- runFlow:
    file: ../../helpers/group-invite-setup.yml
    env:
      SCENARIO: zero-readable
- runFlow:
    file: ../../helpers/group-invite-sign-in-alice.yml
- openLink: 'blacksky://join/${output.groupInviteCode}'
- extendedWaitUntil:
    visible:
      id: groupInviteAcceptButton
    timeout: 30000
- tapOn:
    id: groupInviteAcceptButton
- extendedWaitUntil:
    visible:
      id: groupInviteNoReadableFeeds
    timeout: 30000
- assertVisible: 'No feeds available.'
- assertVisible:
    id: groupInviteNoReadableWarning
- assertVisible: 'Please let your admins know if you think this is a mistake.'
- assertNotVisible:
    id: groupInvitePinOpenButton
- runScript:
    file: ../../helpers/assert-group-invite-state.js
    env:
      EXPECT_ACCEPT_REQUESTS: '1'
      EXPECT_CLAIM_COUNT: '1'
