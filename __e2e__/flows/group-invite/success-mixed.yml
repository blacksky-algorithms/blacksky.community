appId: community.blacksky.app
---
- runFlow:
    file: ../../helpers/group-invite-setup.yml
    env:
      SCENARIO: mixed
- runFlow:
    file: ../../helpers/group-invite-sign-in-alice.yml
- openLink: 'blacksky://join/${output.groupInviteCode}'
- extendedWaitUntil:
    visible:
      id: groupInviteAcceptButton
    timeout: 30000
- tapOn:
    id: groupInviteAcceptButton
- extendedWaitUntil:
    visible:
      id: groupInviteAcceptedMembership
    timeout: 30000
- assertVisible:
    id: groupInviteFeedOption-0
- assertVisible: '.*Read only.*'
- assertVisible:
    id: groupInviteFeedOption-1
- assertVisible: '.*Postable feed.*Post.*read.*'
- assertNotVisible:
    id: groupInviteFeedOption-2
- assertNotVisible: '.*Inaccessible feed.*'
- tapOn:
    id: groupInvitePinOpenButton
- extendedWaitUntil:
    visible:
      id: homeScreen
    timeout: 30000
- assertVisible: e2e-group-post
- runScript:
    file: ../../helpers/assert-group-invite-state.js
    env:
      EXPECT_ACCEPT_REQUESTS: '1'
      EXPECT_ACCEPT_WITH_BEARER: '1'
      EXPECT_CLAIM_COUNT: '1'
      EXPECT_CLAIMANT_COUNT: '1'
      EXPECT_SAVED_TOTAL: '2'
      EXPECT_SAVED_PINNED: '2'
      EXPECT_SAVED_VISIBLE: '2'
      EXPECT_VISIBLE_PINNED: '2'
      EXPECT_INACCESSIBLE_SAVED: '0'
