<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
      <meta name="theme-color" content="#6060E9">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="preconnect" href="https://blacksky.community">
    <link rel="preconnect" href="https://go.blacksky.community">
    <!-- let js set by leaving empty -->
    <title></title>
    <meta name="description" content="Decentralized social media built for community power, culture, and collective freedom." />

    <link rel="preload" as="font" type="font/woff2" href="/assets/assets/fonts/inter/InterVariable.woff2" crossorigin>

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/assets/assets/fonts/inter/InterVariable.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/assets/assets/fonts/inter/InterVariable-Italic.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'BasteB';
        src: url(/assets/assets/fonts/baste_b/BasteB-Regular.woff2) format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'AzeretMonoVariable';
        src: url(/assets/assets/fonts/azeret_mono/AzeretMono-VariableFont_wght.ttf) format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'RubikVariable';
        src: url(/assets/assets/fonts/rubik/Rubik-VariableFont_wght.ttf) format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html {
        --brand-bg-light: #F8FAF9;
        --brand-bg-dark: #070C0C;
        --brand-bg-dim: #161E27;
        --brand-selection-light: #D2FC51;
        --brand-selection-dark: #464985;
        --brand-hue: 240;
        background-color: var(--brand-bg-light);
        color: #000000;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: var(--brand-bg-dark);
          color: #FFFFFF;
        }
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      #splash {
        position: fixed;
        width: 100px;
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translateY(-50%) translateY(-50px);
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
  </head>

  <body>
    <!--
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <h1 lang="en">Blacksky</h1>
          <p lang="en">Decentralized social media built for community power, culture, and collective freedom.</p>
          <div data-nosnippet>
            <p lang="en">Enable JavaScript to use Blacksky.</p>
            <p lang="en" style="margin: 20px 0;">
              <button
                type="submit"
                style="
                  background-color: #4630eb;
                  border-radius: 100px;
                  border: none;
                  box-shadow: none;
                  color: #fff;
                  cursor: pointer;
                  font-weight: bold;
                  line-height: 20px;
                  padding: 6px 16px;
                "
              >
                Reload
              </button>
            </p>
          </div>
        </div>
      </form>
    </noscript>

    <!-- The root element for your Expo app. -->
  <div id="root">
    <div id="splash">
      <picture>
        <source srcset="/static/logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="/static/logo-light.png" alt="" style="width:100%;height:auto;display:block">
      </picture>
    </div>
  </div>
  </body>
</html>
