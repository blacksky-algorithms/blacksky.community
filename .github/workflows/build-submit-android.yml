name: Build QA Android
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      build_number:
        type: string
        required: true
      candidate_attempt:
        type: string
        default: ''
      profile:
        type: string
        default: release
  workflow_dispatch:
    inputs:
      sha:
        description: Exact candidate SHA
        type: string
        required: true
      build_number:
        description: Unique unused native build number
        type: string
        required: true
      profile:
        description: Production candidate or dedicated OTA QA installation
        type: choice
        options: [release-qa, release]
        default: release-qa
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'blacksky-algorithms/blacksky.community'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release-build
    concurrency:
      group: native-android
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ENV_TOKEN: ${{ secrets.ENV_TOKEN }}
      GOOGLE_SERVICES_TOKEN: ${{ secrets.GOOGLE_SERVICES_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      BITDRIFT_API_KEY: ${{ secrets.BITDRIFT_API_KEY }}
      EXPO_PUBLIC_GCP_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_GCP_PROJECT_ID }}
      EXPO_PUBLIC_METRICS_API_HOST: ${{ secrets.EXPO_PUBLIC_METRICS_API_HOST }}
      EXPO_PUBLIC_GROWTHBOOK_API_HOST: ${{ secrets.EXPO_PUBLIC_GROWTHBOOK_API_HOST }}
      EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY }}
      EXPO_PUBLIC_STRIPE_API_URL: ${{ secrets.EXPO_PUBLIC_STRIPE_API_URL }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      CANDIDATE_SHA: ${{ inputs.sha }}
      NATIVE_BUILD_NUMBER: ${{ inputs.build_number }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
      BSKY_IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      BSKY_ANDROID_VERSION_CODE: ${{ inputs.build_number }}
      NATIVE_PROFILE: ${{ inputs.profile }}
      EXPO_PUBLIC_ENV: production
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      RELEASE_APP_IDENTIFIER: ${{ vars.RELEASE_APP_IDENTIFIER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-setup # zizmor: ignore[self-repository] -- actionlint does not yet support the new self-repository syntax.
      - run: node scripts/release/build.mjs native-config
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '17'
      - name: Build AAB
        run: pnpm exec eas build -p android --profile "$NATIVE_PROFILE" --local --output candidate.aab --non-interactive
      - uses: amyu/setup-bundletool@cc2e1857284660bd625e43f2c8a45626f034302f
        with:
          bundletool-version: '1.17.2'
      - name: Verify binary identity
        run: |
          export ACTUAL_APP_IDENTIFIER="$(bundletool dump manifest --bundle=candidate.aab --xpath='/manifest/@package')"
          export ACTUAL_RUNTIME="$(bundletool dump manifest --bundle=candidate.aab --xpath='/manifest/application/meta-data[@android:name="expo.modules.updates.EXPO_RUNTIME_VERSION"]/@android:value')"
          export ACTUAL_VERSION="$(bundletool dump manifest --bundle=candidate.aab --xpath='/manifest/@android:versionName')"
          export ACTUAL_BUILD_NUMBER="$(bundletool dump manifest --bundle=candidate.aab --xpath='/manifest/@android:versionCode')"
          if [[ "$ACTUAL_RUNTIME" == @* || "$ACTUAL_RUNTIME" == 0x* ]]; then
            bundletool dump resources --bundle=candidate.aab --resource="${ACTUAL_RUNTIME#@}" --values > runtime-resources.txt
            export ACTUAL_RUNTIME="$(node scripts/release/android-runtime.mjs runtime-resources.txt)"
          fi
          test "$ACTUAL_RUNTIME" = "$ACTUAL_VERSION"
          NATIVE_ARTIFACT=candidate.aab node scripts/release/build.mjs native-record android
      - name: Upload to Play internal testing
        run: pnpm exec eas submit -p android --profile release-qa --non-interactive --path candidate.aab
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-android-${{ inputs.sha }}-${{ github.run_attempt }}
          path: |
            native-android.json
            candidate.aab
          retention-days: 90
          if-no-files-found: error
      - name: Remove credentials
        if: always()
        run: rm -f .env google-services.json
