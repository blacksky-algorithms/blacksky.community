name: build-and-push-bskyweb-docr
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      tag:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
    inputs:
      variant:
        description: Image tags and OAuth configuration
        type: choice
        options: [production, staging]
        default: production
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'blacksky-algorithms/blacksky.community'
    runs-on: ubuntu-latest
    environment: release-build
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      RELEASE_IMAGE_REPOSITORY: ${{ vars.RELEASE_IMAGE_REPOSITORY || 'registry.digitalocean.com/blacksky/blacksky-community' }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Log into DOCR
        run: |
          printf '%s' "$DIGITALOCEAN_ACCESS_TOKEN" | docker login registry.digitalocean.com --username "$DIGITALOCEAN_ACCESS_TOKEN" --password-stdin
      - id: image
        env:
          EXPO_PUBLIC_METRICS_API_HOST: ${{ secrets.EXPO_PUBLIC_METRICS_API_HOST }}
          EXPO_PUBLIC_GROWTHBOOK_API_HOST: ${{ secrets.EXPO_PUBLIC_GROWTHBOOK_API_HOST }}
          EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY }}
          EXPO_PUBLIC_STRIPE_API_URL: ${{ secrets.EXPO_PUBLIC_STRIPE_API_URL }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ -n "$INPUT_TAG" ]; then
            set -- --tag "$RELEASE_IMAGE_REPOSITORY:$INPUT_TAG"
          elif [ "$INPUT_VARIANT" = "staging" ]; then
            set -- --tag "$RELEASE_IMAGE_REPOSITORY:staging" --tag "$RELEASE_IMAGE_REPOSITORY:staging-$sha" \
              --build-arg 'EXPO_PUBLIC_OAUTH_BASE_URL=https://staging.blacksky.community' \
              --build-arg 'EXPO_PUBLIC_OAUTH_CLIENT_NAME=Blacksky Community (Staging)'
          else
            set -- --tag "$RELEASE_IMAGE_REPOSITORY:$sha" --tag "$RELEASE_IMAGE_REPOSITORY:latest"
          fi
          docker buildx create --use
          docker buildx build --platform linux/amd64 --push --metadata-file image.json \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --build-arg EXPO_PUBLIC_ENV=production \
            --build-arg EXPO_PUBLIC_RELEASE_VERSION="$(jq -r .version package.json)" \
            --build-arg EXPO_PUBLIC_BUNDLE_IDENTIFIER="$sha" \
            --build-arg EXPO_PUBLIC_METRICS_API_HOST \
            --build-arg EXPO_PUBLIC_GROWTHBOOK_API_HOST \
            --build-arg EXPO_PUBLIC_GROWTHBOOK_CLIENT_KEY \
            --build-arg EXPO_PUBLIC_STRIPE_API_URL \
            --build-arg EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            "$@" .
          echo "digest=$(jq -r '."containerimage.digest"' image.json)" >> "$GITHUB_OUTPUT"
